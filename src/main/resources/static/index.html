<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot Gemini - Salina Cruz</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 h-screen flex flex-col text-white">
    <div class="p-4 bg-blue-600 shadow-lg text-center font-bold uppercase tracking-widest">
        Gemini AI Backend
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-800">
        <div class="bg-blue-500/20 p-3 rounded-lg border border-blue-500/30 text-sm italic text-blue-200">
            ¡Sistema listo! Escribe algo para comenzar...
        </div>
    </div>

    <div class="p-4 bg-slate-900 border-t border-slate-700">
		<form hx-post="/chat" 
		      hx-target="#chat-messages" 
		      hx-swap="beforeend" 
		      hx-on::after-request="this.reset()"
		      hx-on::before-request="document.getElementById('chat-messages').insertAdjacentHTML('beforeend', '<div class=\'text-right\'><span class=\'bg-slate-700 p-2 rounded-lg inline-block\'>' + this.querySelector('[name=message]').value + '</span></div>')">
            <input type="text" name="message" 
                   class="flex-1 bg-slate-800 border border-slate-600 rounded-lg p-3 focus:outline-none focus:border-blue-500" 
                   placeholder="Escribe tu mensaje aquí..." required>
            <button type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-bold transition-all">
                Enviar
            </button>
        </form>
    </div>
</body>
</html>
